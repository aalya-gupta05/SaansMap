<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaansMap — Delhi Clean Air Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: Arial, sans-serif; background:#fafafa; }
  #header { background:#0b3d2e; color:#fff; padding:10px 14px; }
  #header h1 { margin:0; font-size:18px; }
  #header p { margin:2px 0 0; font-size:12px; opacity:.85; }
  #avg { padding:8px 14px; background:#e8f5e9; font-size:13px; border-bottom:1px solid #ddd; }
  #err { display:none; padding:8px 14px; background:#ffebee; color:#b71c1c; font-size:12px; }
  #map { height: 58vh; }
  #legend { padding:8px 14px; font-size:12px; background:#fff; border-top:1px solid #ddd; display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .dot { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:4px; vertical-align:middle; }
  #toggleGreen { padding:6px 10px; border:1px solid #2e7d32; background:#e8f5e9; color:#2e7d32; border-radius:6px; font-size:12px; cursor:pointer; }
  #list { max-height:20vh; overflow-y:auto; padding:4px 14px; font-size:12px; background:#fafafa; }
  .row { padding:7px 0; border-bottom:1px solid #eee; cursor:pointer; }
  .row b { font-size:13px; }
  .score-chip { float:right; font-weight:bold; padding:1px 8px; border-radius:10px; color:#fff; }
  .muted { color:#777; font-size:11px; }
</style>
</head>
<body>

<div id="header">
  <h1>🌬️ SaansMap — Delhi Clean Air Map</h1>
  <p>Air quality + green cover = where the clean air is</p>
</div>
<div id="avg">Loading live air quality data…</div>
<div id="err"></div>
<div id="map"></div>
<div id="legend">
  <span><span class="dot" style="background:#2e7d32"></span>80–100 Cleaner</span>
  <span><span class="dot" style="background:#8bc34a"></span>60–79 Fair</span>
  <span><span class="dot" style="background:#fbc02d"></span>40–59 Poor</span>
  <span><span class="dot" style="background:#f57c00"></span>20–39 Very poor</span>
  <span><span class="dot" style="background:#c62828"></span>0–19 Severe</span>
  <span><span class="dot" style="background:#9e9e9e"></span>Stale (24h+)</span>
  <button id="toggleGreen">🌳 Green Areas: OFF</button>
</div>
<div id="list"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const WAQI_TOKEN = "11c17992f86e2f9e2df19d8f78ac9676b39259b0";
const CENTER = [28.61, 77.20];
const BBOX = "28.4,76.8,28.9,77.6";
const STALE_HOURS = 24;

const map = L.map("map").setView(CENTER, 11);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap"
}).addTo(map);

const errBox = document.getElementById("err");
function showErr(msg) { errBox.style.display = "block"; errBox.textContent = msg; }

function airScore(pm25) { return Math.max(0, Math.round(100 - pm25 / 2.5)); }
function colorFor(score) {
  if (score >= 80) return "#2e7d32";
  if (score >= 60) return "#8bc34a";
  if (score >= 40) return "#fbc02d";
  if (score >= 20) return "#f57c00";
  return "#c62828";
}
function timeAgo(iso) {
  const hrs = (Date.now() - new Date(iso)) / 3600000;
  if (hrs < 1) return Math.round(hrs * 60) + " min ago";
  return Math.round(hrs) + " hr ago";
}
function isStale(iso) {
  return (Date.now() - new Date(iso)) / 3600000 > STALE_HOURS;
}

function pointInPoly(lat, lon, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i].lon, yi = poly[i].lat, xj = poly[j].lon, yj = poly[j].lat;
    if (((yi > lat) !== (yj > lat)) &&
        (lon < (xj - xi) * (lat - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}

function greenPercent(lat, lon, polygons) {
  const R = 1.0, step = 0.25;
  let inside = 0, total = 0;
  const kmPerDegLat = 111;
  const kmPerDegLon = 111 * Math.cos(lat * Math.PI / 180);
  for (let dx = -R; dx <= R; dx += step) {
    for (let dy = -R; dy <= R; dy += step) {
      if (dx * dx + dy * dy > R * R) continue;
      total++;
      const plat = lat + dy / kmPerDegLat;
      const plon = lon + dx / kmPerDegLon;
      for (const poly of polygons) {
        if (pointInPoly(plat, plon, poly)) { inside++; break; }
      }
    }
  }
  return total ? Math.round((inside / total) * 100) : 0;
}

async function fetchStations() {
  const url = "https://api.waqi.info/map/bounds/?latlng=" + BBOX + "&token=" + WAQI_TOKEN;
  const r = await fetch(url);
  const j = await r.json();
  if (j.status !== "ok") throw new Error("WAQI station list failed");
  return j.data.slice(0, 40);
}

async function fetchStationDetail(uid) {
  const r = await fetch("https://api.waqi.info/feed/@" + uid + "/?token=" + WAQI_TOKEN);
  const j = await r.json();
  if (j.status !== "ok" || !j.data.iaqi || !j.data.iaqi.pm25) return null;
  const d = j.data;
  return {
    uid: uid,
    name: d.city.name,
    lat: d.city.geo[0],
    lon: d.city.geo[1],
    pm25: d.iaqi.pm25.v,
    time: d.time.iso
  };
}

async function fetchGreenAreas() {
  const q = `[out:json][timeout:30];(
    way["leisure"="park"](${BBOX});
    way["leisure"="garden"](${BBOX});
    way["landuse"="forest"](${BBOX});
    way["natural"="wood"](${BBOX});
    relation["leisure"="park"](${BBOX});
    relation["landuse"="forest"](${BBOX});
  );out geom;`;
  const r = await fetch("https://overpass-api.de/api/interpreter", {
    method: "POST",
    body: "data=" + encodeURIComponent(q)
  });
  const j = await r.json();
  return j.elements
    .filter(e => e.geometry && e.geometry.length >= 3)
    .map(e => e.geometry);
}

let greenLayer = null, greenOn = false;
const toggleBtn = document.getElementById("toggleGreen");

function render(stations, greenPolys) {
  const fresh = stations.filter(s => !isStale(s.time));
  const stale = stations.filter(s => isStale(s.time));

  if (fresh.length) {
    const avg = fresh.reduce((a, s) => a + s.pm25, 0) / fresh.length;
    const newest = fresh.map(s => new Date(s.time)).sort((a, b) => b - a)[0];
    document.getElementById("avg").innerHTML =
      "🟢 <b>" + fresh.length + "</b> live stations &nbsp;|&nbsp; Average PM2.5: <b>" +
      avg.toFixed(1) + " µg/m³</b> &nbsp;|&nbsp; Data: " + timeAgo(newest.toISOString());
  } else {
    document.getElementById("avg").textContent = "No fresh readings in last " + STALE_HOURS + " hours.";
  }

  const listEl = document.getElementById("list");
  listEl.innerHTML = "";
  const sorted = [...stations].sort((a, b) =>
    (0.7 * airScore(a.pm25) + 0.3 * a.green) - (0.7 * airScore(b.pm25) + 0.3 * b.green));

  sorted.forEach(s => {
    const aScore = airScore(s.pm25);
    const sScore = Math.round(0.7 * aScore + 0.3 * s.green);
    const staleNow = isStale(s.time);
    const col = staleNow ? "#9e9e9e" : colorFor(sScore);

    const m = L.circleMarker([s.lat, s.lon], {
      radius: 6 + Math.min(14, s.pm25 / 25),
      color: col, fillColor: col, fillOpacity: 0.75, weight: 1
    }).addTo(map);

    m.bindPopup(
      "<b>" + s.name + "</b><br>" +
      "PM2.5: <b>" + s.pm25 + " µg/m³</b><br>" +
      "Air Score: <b>" + aScore + "/100</b><br>" +
      "🌳 Green cover (1km): <b>" + s.green + "%</b><br>" +
      "<b>SaansMap Score: " + sScore + "/100</b><br>" +
      "<span style='color:#777;font-size:11px'>" + (staleNow ? "STALE · " : "") + "Updated " + timeAgo(s.time) + "</span>"
    );

    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML =
      "<span class='score-chip' style='background:" + col + "'>" + sScore + "</span>" +
      "<b>" + s.name + "</b><br>" +
      "<span class='muted'>PM2.5 " + s.pm25 + " · Green " + s.green + "% · " + timeAgo(s.time) + "</span>";
    row.onclick = () => { map.setView([s.lat, s.lon], 13); m.openPopup(); };
    listEl.appendChild(row);
  });

  greenLayer = L.layerGroup(greenPolys.map(poly =>
    L.polygon(poly.map(p => [p.lat, p.lon]), {
      color: "#2e7d32", weight: 1, fillColor: "#66bb6a", fillOpacity: 0.25
    })
  ));
  toggleBtn.onclick = () => {
    greenOn = !greenOn;
    if (greenOn) { greenLayer.addTo(map); toggleBtn.textContent = "🌳 Green Areas: ON"; }
    else { map.removeLayer(greenLayer); toggleBtn.textContent = "🌳 Green Areas: OFF"; }
  };
}

(async function main() {
  if (WAQI_TOKEN === "PASTE_YOUR_TOKEN_HERE") {
    showErr("⚠️ Apna WAQI token code mein paste karo");
    return;
  }
  try {
    const stationList = await fetchStations();
    const details = [];
    for (const s of stationList) {
     const uid = Array.isArray(s) ? s[3] : s.uid;
     const d = await fetchStationDetail(uid);
     if (d) details.push(d);
     await new Promise(r => setTimeout(r, 250));
    }
    const stations = details.filter(Boolean);
    if (!stations.length) throw new Error("No PM2.5 stations found");

    let greenPolys = [];
    try { greenPolys = await fetchGreenAreas(); } catch (e) { console.warn("Overpass failed", e); }

    stations.forEach(s => { s.green = greenPercent(s.lat, s.lon, greenPolys); });

    render(stations, greenPolys);
  } catch (e) {
    showErr("Error loading data: " + e.message + " — refresh karke dobara try karo.");
  }
})();
</script>
</body>
</html>
